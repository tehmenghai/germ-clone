<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="7" fill="#0a1a0e"/>
  <!-- Neo silhouette: trench coat body -->
  <path d="M16 6 C13 6 11 8 11 11 L9 28 L14 28 L15 18 L17 18 L18 28 L23 28 L21 11 C21 8 19 6 16 6Z"
        fill="#00ff41" fill-opacity="0.85"/>
  <!-- Head -->
  <ellipse cx="16" cy="7" rx="3.5" ry="3.8" fill="#00ff41" fill-opacity="0.90"/>
  <!-- Sunglasses: two rectangular lenses + bridge + temples -->
  <rect x="11.5" y="6.0" width="3.8" height="2.0" rx="0.7" fill="#0a1a0e" stroke="#00ff41" stroke-width="0.5"/>
  <rect x="16.7" y="6.0" width="3.8" height="2.0" rx="0.7" fill="#0a1a0e" stroke="#00ff41" stroke-width="0.5"/>
  <!-- Bridge -->
  <line x1="15.3" y1="7" x2="16.7" y2="7" stroke="#00ff41" stroke-width="0.5"/>
  <!-- Temples -->
  <line x1="11.5" y1="7" x2="10.2" y2="7.5" stroke="#00ff41" stroke-width="0.5"/>
  <line x1="20.5" y1="7" x2="21.8" y2="7.5" stroke="#00ff41" stroke-width="0.5"/>
  <!-- Coat collar flare left -->
  <path d="M11 11 L8 16 L11 14Z" fill="#00ff41" fill-opacity="0.70"/>
  <!-- Coat collar flare right -->
  <path d="M21 11 L24 16 L21 14Z" fill="#00ff41" fill-opacity="0.70"/>
  <!-- Subtle green glow backdrop -->
  <ellipse cx="16" cy="16" rx="14" ry="14" fill="none" stroke="#00ff41" stroke-width="0.3" opacity="0.18"/>
</svg>
