<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="7" fill="#050f07"/>

  <!-- Head: organic asymmetric outline, slightly irregular beziers -->
  <path
    d="M16 4.8
       C13.1 4.6 10.3 6.2 9.3 8.7
       C8.5 10.7 8.7 12.4 8.1 14.6
       C7.6 16.8 7.9 18.6 9.3 20.2
       C10.6 21.7 12.1 23.0 13.2 24.6
       C14.1 25.8 14.9 26.7 16 26.9
       C17.1 26.7 17.9 25.9 18.8 24.7
       C19.9 23.2 21.5 21.8 22.7 20.3
       C24.1 18.6 24.4 16.9 23.9 14.7
       C23.4 12.5 23.5 10.8 22.7 8.8
       C21.7 6.3 18.9 4.9 16 4.8Z"
    stroke="#00e050" stroke-width="1.05" stroke-linejoin="round" opacity="0.88"
    style="stroke-dasharray: none"
  />

  <!-- Nose hint — short slightly curved stroke -->
  <path d="M15.6 16.8 Q16 17.4 16.4 16.9" stroke="#00e050" stroke-width="0.65" stroke-linecap="round" opacity="0.45"/>

  <!-- Left lens — slightly irregular quad, not a perfect rect -->
  <path
    d="M8.8 13.2
       Q9.2 11.9 10.7 11.8
       L14.4 11.75
       Q15.1 11.85 15.3 12.7
       L15.25 14.85
       Q15.05 15.65 14.3 15.7
       L10.5 15.65
       Q9.1 15.5 8.7 14.4 Z"
    stroke="#00e050" stroke-width="0.9" stroke-linejoin="round"
    fill="#00e050" fill-opacity="0.09"
  />

  <!-- Right lens — mirror with slight positional nudge for asymmetry -->
  <path
    d="M23.2 13.3
       Q22.8 12.0 21.3 11.85
       L17.6 11.8
       Q16.9 11.9 16.7 12.75
       L16.75 14.9
       Q16.95 15.7 17.7 15.75
       L21.5 15.7
       Q22.9 15.55 23.3 14.45 Z"
    stroke="#00e050" stroke-width="0.9" stroke-linejoin="round"
    fill="#00e050" fill-opacity="0.09"
  />

  <!-- Bridge — slight curve instead of straight line -->
  <path d="M15.3 13.6 Q16 13.3 16.7 13.6" stroke="#00e050" stroke-width="0.85" stroke-linecap="round"/>

  <!-- Temple left — slightly angled, not perfectly horizontal -->
  <path d="M8.8 13.5 C8.1 13.7 7.4 14.1 6.9 14.4" stroke="#00e050" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Temple right -->
  <path d="M23.2 13.6 C23.9 13.8 24.6 14.2 25.1 14.5" stroke="#00e050" stroke-width="0.8" stroke-linecap="round"/>
</svg>
