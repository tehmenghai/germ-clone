<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <style>
    :root {
      --bg: #050f07;
      --stroke: #00b840;
      --hair: #00b840;
      --lens-fill: rgba(0,184,64,0.09);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --stroke: #2a2f3a;
        --hair: #1a1e28;
        --lens-fill: rgba(42,47,58,0.07);
      }
    }
  </style>

  <rect width="32" height="32" rx="7" fill="var(--bg)"/>

  <!-- Head — rounded chin -->
  <path
    d="M16 6.5
       C13.5 6.3 11.0 7.6 9.8 9.8
       C8.9 11.5 9.1 13.0 8.6 15.0
       C8.1 17.0 8.4 18.7 9.6 20.1
       C10.8 21.5 12.0 22.5 13.0 23.6
       C14.0 24.7 15.0 25.4 16 25.5
       C17.0 25.4 18.0 24.7 19.0 23.6
       C20.0 22.5 21.2 21.5 22.4 20.1
       C23.6 18.7 23.9 17.0 23.4 15.0
       C23.0 13.0 23.1 11.5 22.2 9.8
       C21.0 7.6 18.5 6.3 16 6.5Z"
    stroke="var(--stroke)" stroke-width="1.0" stroke-linejoin="round" opacity="0.85"
  />

  <!-- Neo fringe hair — 5 layered sweeping strands -->
  <path d="M8.5 10.5 C9.2 6.5 12.0 4.0 14.2 6.5 C14.9 7.3 15.4 8.5 15.8 9.5" stroke="var(--hair)" stroke-width="1.2" stroke-linecap="round" opacity="0.95"/>
  <path d="M9.5 9.2 C10.5 5.5 13.2 3.8 15.0 6.5 C15.6 7.4 16.0 8.6 16.2 9.4" stroke="var(--hair)" stroke-width="1.05" stroke-linecap="round" opacity="0.82"/>
  <path d="M10.5 8.0 C11.8 4.2 14.8 3.2 16.8 5.6 C17.5 6.5 17.8 7.8 17.9 9.0" stroke="var(--hair)" stroke-width="0.9" stroke-linecap="round" opacity="0.68"/>
  <path d="M12.0 7.0 C13.5 3.5 16.8 2.8 18.5 5.2 C19.1 6.1 19.3 7.4 19.1 8.6" stroke="var(--hair)" stroke-width="0.75" stroke-linecap="round" opacity="0.52"/>
  <path d="M13.5 6.5 C15.0 3.2 18.2 2.5 19.8 4.8 C20.3 5.7 20.4 7.0 20.0 8.2" stroke="var(--hair)" stroke-width="0.6" stroke-linecap="round" opacity="0.35"/>

  <!-- Nose hint -->
  <path d="M15.6 17.0 Q16 17.5 16.4 17.0" stroke="var(--stroke)" stroke-width="0.6" stroke-linecap="round" opacity="0.4"/>

  <!-- Left lens -->
  <path
    d="M9.0 13.4 C9.1 12.2 9.9 11.7 11.0 11.7 L14.2 11.7 C14.9 11.8 15.2 12.4 15.2 13.0 L15.2 15.0 C15.1 15.7 14.6 15.9 13.9 15.9 L10.8 15.9 C9.7 15.8 8.9 15.2 9.0 14.2 Z"
    stroke="var(--stroke)" stroke-width="0.85" stroke-linejoin="round"
    fill="var(--lens-fill)"
  />

  <!-- Right lens -->
  <path
    d="M23.0 13.4 C22.9 12.2 22.1 11.7 21.0 11.7 L17.8 11.7 C17.1 11.8 16.8 12.4 16.8 13.0 L16.8 15.0 C16.9 15.7 17.4 15.9 18.1 15.9 L21.2 15.9 C22.3 15.8 23.1 15.2 23.0 14.2 Z"
    stroke="var(--stroke)" stroke-width="0.85" stroke-linejoin="round"
    fill="var(--lens-fill)"
  />

  <!-- Bridge -->
  <path d="M15.2 13.5 Q16 13.2 16.8 13.5" stroke="var(--stroke)" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Temple left -->
  <path d="M9.0 13.6 C8.3 13.8 7.6 14.1 7.1 14.4" stroke="var(--stroke)" stroke-width="0.75" stroke-linecap="round"/>

  <!-- Temple right -->
  <path d="M23.0 13.6 C23.7 13.8 24.4 14.1 24.9 14.4" stroke="var(--stroke)" stroke-width="0.75" stroke-linecap="round"/>
</svg>
