<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 16" fill="none">
  <defs>
    <linearGradient id="blueBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#00008b"/>
      <stop offset="45%"  stop-color="#1a44cc"/>
      <stop offset="100%" stop-color="#3377ff"/>
    </linearGradient>
    <linearGradient id="blueShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="55%"  stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="blueShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.30"/>
    </linearGradient>
    <filter id="blueGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Pill body -->
  <rect x="1" y="1" width="34" height="14" rx="7" fill="url(#blueBody)" filter="url(#blueGlow)"/>
  <!-- Shadow layer -->
  <rect x="1" y="1" width="34" height="14" rx="7" fill="url(#blueShadow)"/>
  <!-- Specular highlight -->
  <rect x="3" y="2" width="30" height="6" rx="4" fill="url(#blueShine)"/>
  <!-- Centre seam -->
  <line x1="18" y1="1" x2="18" y2="15" stroke="#000066" stroke-width="0.8" opacity="0.6"/>
  <!-- Outer edge stroke -->
  <rect x="1" y="1" width="34" height="14" rx="7" fill="none" stroke="#0a2a80" stroke-width="0.7" opacity="0.7"/>
</svg>
