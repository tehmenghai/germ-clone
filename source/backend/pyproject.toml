[project]
name = "germ-clone-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]  # line-length enforced by formatter

[tool.ruff.lint.isort]
known-first-party = ["app", "repository", "ingestion", "schemas", "streaming", "llm", "rag"]

[tool.ruff.format]
quote-style = "double"
