name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint + test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -r source/backend/requirements.txt

      - name: Lint (ruff)
        run: ruff check source/backend/

      - name: Test (pytest)
        run: pytest tests/ -v
        working-directory: source/backend
        env:
          # repository/database.py reads DATABASE_URL at import time, and
          # conftest imports it, so collection fails without this. Locally the
          # value comes from source/backend/.env, which CI has no equivalent of.
          # The suite never opens a connection — conftest stubs all graph I/O
          # and disposes the engine — so any well-formed URL will do.
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci

  frontend:
    name: Frontend — lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm --dir source/frontend install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm --dir source/frontend lint
