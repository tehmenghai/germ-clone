<!DOCTYPE html>
<html lang="en" data-theme="matrix">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Germayne//clone · ML tutor</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<canvas id="rain"></canvas>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="content.jsx"></script>
<script type="text/babel" src="viz.jsx"></script>
<script type="text/babel" src="pipeline.jsx"></script>
<script type="text/babel" src="workspace.jsx"></script>
<script type="text/babel" src="app.jsx"></script>

<script>
/* digital rain — slow & subtle, pauses in clinical theme */
(function(){
  const c=document.getElementById('rain'); if(!c) return; const x=c.getContext('2d');
  let w,h,cols,drops,fs=8;
  const glyphs="01<>=+ﾊﾐﾋｰｳｼﾅﾓﾆｻﾜﾂｵﾘｱﾎﾃﾏｹﾒｴｶｷﾑﾕﾗｾﾈｽﾀﾇﾉあいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろ∑∂∇μσβθλ".split("");
  function init(){ w=c.width=innerWidth; h=c.height=innerHeight; cols=Math.floor(w/(fs*2.2)); drops=Array(cols).fill(0).map(()=>Math.random()>0.55 ? -(Math.random()*h) : Math.random()*-60); }
  function draw(){
    const theme=document.documentElement.getAttribute('data-theme');
    if(theme!=='matrix'){ x.clearRect(0,0,w,h); requestAnimationFrame(draw); return; }
    x.fillStyle="rgba(8,16,11,0.025)"; x.fillRect(0,0,w,h);
    x.font=fs+"px JetBrains Mono, monospace";
    for(let i=0;i<cols;i++){
      const t=glyphs[Math.floor(Math.random()*glyphs.length)];
      const y=drops[i]*fs;
      x.fillStyle = Math.random()>0.96 ? "rgba(130,195,155,0.55)" : "rgba(72,138,98,0.40)";
      x.fillText(t,i*(fs*2.2),y);
      if(y>h&&Math.random()>0.99) drops[i]=0;
      drops[i]+=0.08;
    }
    requestAnimationFrame(draw);
  }
  addEventListener('resize',init); init(); draw();
})();
</script>
</body>
</html>
