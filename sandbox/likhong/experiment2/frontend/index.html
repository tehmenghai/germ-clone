<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Experiment2 — Chunk Viewer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3352;
      --accent: #6c8cff;
      --accent2: #a78bfa;
      --text: #e2e8f0;
      --muted: #7a849e;
      --danger: #f87171;
      --success: #34d399;
      --warning: #fbbf24;

      --type-theorem:    #6c8cff;
      --type-proof:      #a78bfa;
      --type-definition: #34d399;
      --type-example:    #fbbf24;
      --type-exercise:   #fb923c;
      --type-remark:     #94a3b8;
      --type-section:    #f472b6;
      --type-table:      #22d3ee;
      --type-figure:     #86efac;
      --type-other:      #475569;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ---- Header ---- */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }
    header h1 { font-size: 15px; font-weight: 600; color: var(--accent); letter-spacing: 0.5px; }
    header .subtitle { font-size: 12px; color: var(--muted); }

    /* ---- Layout ---- */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ---- Sidebar ---- */
    aside {
      width: 300px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 16px;
      gap: 16px;
    }

    .field-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; }

    select, input[type="text"] {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 13px;
      width: 100%;
      outline: none;
    }
    select:focus, input[type="text"]:focus { border-color: var(--accent); }

    .method-toggle {
      display: flex;
      gap: 8px;
    }
    .method-btn {
      flex: 1;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    .method-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .method-btn:hover:not(.active) { border-color: var(--accent); color: var(--text); }

    .marker-options {
      display: none;
      flex-direction: column;
      gap: 6px;
    }
    .marker-options.visible { display: flex; }

    .opt-toggle {
      display: flex;
      gap: 6px;
    }
    .opt-chip {
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      user-select: none;
    }
    .opt-chip.on {
      border-color: var(--accent2);
      background: rgba(167,139,250,0.15);
      color: var(--accent2);
    }
    .opt-chip:hover:not(.on) { border-color: var(--accent2); color: var(--text); }

    .marker-warning {
      font-size: 11px;
      color: var(--warning);
      background: rgba(251,191,36,0.08);
      border: 1px solid rgba(251,191,36,0.25);
      border-radius: 5px;
      padding: 8px 10px;
      line-height: 1.5;
    }

    .run-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.15s;
    }
    .run-btn:hover { opacity: 0.85; }
    .run-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .clear-btn {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
      border-radius: 6px;
      padding: 7px;
      font-size: 12px;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.15s;
    }
    .clear-btn:hover { opacity: 0.7; }

    .status-bar {
      font-size: 12px;
      color: var(--muted);
      min-height: 18px;
      line-height: 1.4;
    }
    .status-bar.error { color: var(--danger); }
    .status-bar.success { color: var(--success); }

    /* ---- Filters ---- */
    .divider { border-top: 1px solid var(--border); }

    .type-filter { display: flex; flex-wrap: wrap; gap: 6px; }
    .type-chip {
      padding: 3px 9px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      opacity: 0.45;
      transition: opacity 0.15s;
    }
    .type-chip.on { opacity: 1; }

    .page-range { display: flex; gap: 8px; align-items: center; }
    .page-range input[type="number"] {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 13px;
      width: 70px;
      outline: none;
    }
    .page-range span { font-size: 12px; color: var(--muted); }

    input[type="text"]#search-box { margin-top: 0; }

    /* ---- Chapter filter ---- */
    .chapter-filter { display: flex; flex-wrap: wrap; gap: 5px; }
    .chapter-chip {
      padding: 3px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--accent);
      background: rgba(108,140,255,0.12);
      color: var(--accent);
      opacity: 0.45;
      transition: opacity 0.15s;
    }
    .chapter-chip.on { opacity: 1; }

    /* ---- View tabs ---- */
    .view-tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      background: var(--surface);
    }
    .view-tab {
      padding: 10px 20px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
      user-select: none;
    }
    .view-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    .view-tab:hover:not(.active) { color: var(--text); }

    /* ---- Main area ---- */
    main {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .view-panel {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .view-panel.hidden { display: none; }

    .summary-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
      font-size: 12px;
      color: var(--muted);
      flex-shrink: 0;
    }
    .summary-bar strong { color: var(--text); }

    .spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---- Chunk cards ---- */
    .chunks-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chunk-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      transition: border-color 0.15s;
    }
    .chunk-card:hover { border-color: var(--accent); }

    .chunk-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .chunk-id { font-size: 11px; font-family: monospace; color: var(--muted); }
    .chunk-heading { font-size: 12px; color: var(--text); font-weight: 500; flex: 1; }
    .chunk-meta { display: flex; gap: 6px; align-items: center; margin-left: auto; }
    .chunk-chapter-label {
      font-size: 10px;
      color: var(--accent);
      background: rgba(108,140,255,0.1);
      border-radius: 4px;
      padding: 2px 6px;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .badge {
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border: 1px solid;
    }
    .badge-type { color: #fff; }
    .meta-pill {
      font-size: 10px;
      color: var(--muted);
      background: var(--surface2);
      border-radius: 4px;
      padding: 2px 6px;
    }
    .math-pill {
      font-size: 10px;
      color: var(--accent2);
      background: rgba(167,139,250,0.1);
      border-radius: 4px;
      padding: 2px 6px;
    }

    .chunk-text {
      font-size: 12px;
      color: #b0bec5;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 220px;
      overflow: hidden;
      position: relative;
    }
    .chunk-text.expanded { max-height: none; }
    .chunk-text::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 40px;
      background: linear-gradient(transparent, var(--surface));
      pointer-events: none;
    }
    .chunk-text.expanded::after { display: none; }

    .expand-btn {
      font-size: 11px;
      color: var(--accent);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 0;
      margin-top: 4px;
    }
    .expand-btn:hover { text-decoration: underline; }

    /* ---- Pagination ---- */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 16px 0 4px;
      font-size: 13px;
      flex-shrink: 0;
    }
    .pag-btn {
      padding: 6px 14px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      font-size: 12px;
    }
    .pag-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .pag-btn.active { background: var(--accent); border-color: var(--accent); }
    .pag-info { color: var(--muted); font-size: 12px; }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 10px;
      color: var(--muted);
      font-size: 14px;
      padding: 60px;
      text-align: center;
    }
    .empty-state .icon { font-size: 40px; opacity: 0.3; }

    /* ---- Pipeline view ---- */
    .pipeline-view {
      display: flex;
      flex-direction: column;
      gap: 0;
      padding-bottom: 20px;
    }

    .pipeline-header {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 20px;
    }
    .pipeline-header strong { color: var(--text); }

    .pipeline-lane {
      display: flex;
      align-items: stretch;
      gap: 0;
      margin-bottom: 12px;
    }

    .lane-connector {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 32px;
      flex-shrink: 0;
    }
    .lane-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
      margin-top: 16px;
      box-shadow: 0 0 8px rgba(108,140,255,0.5);
      transition: transform 0.3s ease;
    }
    .lane-dot.animate { transform: scale(1.4); }
    .lane-line {
      width: 2px;
      flex: 1;
      background: linear-gradient(var(--accent), var(--border));
      margin-top: 2px;
      min-height: 12px;
    }
    .pipeline-lane:last-child .lane-line { display: none; }

    .lane-card {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      transition: border-color 0.3s;
    }
    .lane-card.animate { border-color: var(--accent); }

    .lane-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }
    .lane-stage-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }
    .lane-count {
      font-size: 22px;
      font-weight: 700;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      transition: color 0.3s;
      min-width: 48px;
    }
    .lane-count.zero { color: var(--muted); }
    .lane-elapsed {
      margin-left: auto;
      font-size: 11px;
      color: var(--muted);
      background: var(--surface2);
      padding: 2px 7px;
      border-radius: 4px;
    }
    .lane-detail {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.6;
    }
    .lane-bar-wrap {
      margin-top: 10px;
      height: 4px;
      background: var(--surface2);
      border-radius: 2px;
      overflow: hidden;
    }
    .lane-bar {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      width: 0%;
      transition: width 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    /* Stage colour variants */
    .lane-card[data-stage="chapter_detection"] .lane-count { color: #f472b6; }
    .lane-card[data-stage="chapter_detection"] .lane-dot-color { background: #f472b6; }
    .lane-card[data-stage="chapter_detection"] .lane-bar { background: #f472b6; }
    .lane-card[data-stage="chapter_detection"] .lane-dot { background: #f472b6; box-shadow: 0 0 8px rgba(244,114,182,0.5); }

    .lane-card[data-stage="page_extraction"] .lane-count { color: #fbbf24; }
    .lane-card[data-stage="page_extraction"] .lane-bar { background: #fbbf24; }

    .lane-card[data-stage="heading_detection"] .lane-count { color: #34d399; }
    .lane-card[data-stage="heading_detection"] .lane-bar { background: #34d399; }

    .lane-card[data-stage="semantic_typing"] .lane-count { color: var(--accent2); }
    .lane-card[data-stage="semantic_typing"] .lane-bar { background: var(--accent2); }

    .lane-card[data-stage="output"] .lane-count { color: var(--success); }
    .lane-card[data-stage="output"] .lane-bar { background: var(--success); }

    .pipeline-empty {
      color: var(--muted);
      font-size: 13px;
      padding: 40px;
      text-align: center;
    }

    /* Stage name display names */
    .stage-label-map {
      display: none;
    }
  </style>
</head>
<body>

<header>
  <div>
    <h1>Experiment2 — Chunk Viewer</h1>
    <div class="subtitle">PDF chunking comparison: pdfplumber vs marker · chapter-aware preprocessing</div>
  </div>
</header>

<div class="layout">
  <!-- Sidebar -->
  <aside>
    <div class="field-group">
      <label>PDF</label>
      <select id="pdf-select"><option value="">Loading…</option></select>
    </div>

    <div class="field-group">
      <label>Chunking method</label>
      <div class="method-toggle">
        <div class="method-btn active" data-method="pdfplumber">pdfplumber</div>
        <div class="method-btn" data-method="marker">marker</div>
      </div>
      <div class="marker-options" id="marker-options">
        <div class="opt-toggle">
          <div class="opt-chip" id="opt-lowmem" title="Load all models at float16/cpu and skip TableProcessor — saves ~2–3 GB RAM. Tables won't be extracted.">B: low memory</div>
          <div class="opt-chip" id="opt-preslice" title="Write first 50 pages to /tmp before parsing — guarantees marker never walks past page 50 regardless of version quirks.">C: pre-slice</div>
        </div>
        <div class="marker-warning" id="marker-warning"></div>
      </div>
    </div>

    <button class="run-btn" id="run-btn">Chunk (pages 1–50)</button>
    <button class="clear-btn" id="clear-btn">Clear cache</button>
    <div class="status-bar" id="status"></div>

    <div class="divider"></div>

    <div class="field-group">
      <label>Filter by chapter</label>
      <div class="chapter-filter" id="chapter-filter">
        <span style="font-size:11px;color:var(--muted)">Run chunking to see chapters</span>
      </div>
    </div>

    <div class="field-group">
      <label>Filter by type</label>
      <div class="type-filter" id="type-filter"></div>
    </div>

    <div class="field-group">
      <label>Page range</label>
      <div class="page-range">
        <input type="number" id="page-from" min="1" placeholder="from" />
        <span>–</span>
        <input type="number" id="page-to" min="1" placeholder="to" />
      </div>
    </div>

    <div class="field-group">
      <label>Search text</label>
      <input type="text" id="search-box" placeholder="keyword…" />
    </div>
  </aside>

  <!-- Main -->
  <main id="main">
    <div class="view-tabs" id="view-tabs">
      <div class="view-tab active" data-view="chunks">Chunks</div>
      <div class="view-tab" data-view="pipeline">Pipeline</div>
    </div>

    <!-- Chunks panel -->
    <div class="view-panel" id="panel-chunks">
      <div class="summary-bar" id="summary-bar" style="display:none">
        <div class="spinner" id="spinner"></div>
        <span id="summary-text"></span>
      </div>
      <div class="chunks-list" id="chunks-list"></div>
      <div class="pagination" id="pagination" style="display:none"></div>
      <div class="empty-state" id="empty-state">
        <div class="icon">📄</div>
        <div>Select a PDF and click <strong>Chunk</strong> to begin.</div>
      </div>
    </div>

    <!-- Pipeline panel -->
    <div class="view-panel hidden" id="panel-pipeline">
      <div class="pipeline-view" id="pipeline-view">
        <div class="pipeline-empty">Run chunking to see the pipeline.</div>
      </div>
    </div>
  </main>
</div>

<script>
const API = 'http://localhost:8099';
const PAGE_SIZE = 25;

const STAGE_LABELS = {
  chapter_detection:     'Chapter Detection',
  page_extraction:       'Page Extraction',
  model_load:            'Model Load',
  pdf_conversion:        'PDF Conversion',
  heading_detection:     'Heading Detection',
  semantic_typing:       'Semantic Typing',
  token_ceiling_splits:  'Token Ceiling Splits',
  block_classification:  'Block Classification',
  output:                'Output',
};

const TYPE_COLORS = {
  theorem:    'var(--type-theorem)',
  proof:      'var(--type-proof)',
  definition: 'var(--type-definition)',
  example:    'var(--type-example)',
  exercise:   'var(--type-exercise)',
  remark:     'var(--type-remark)',
  section:    'var(--type-section)',
  table:      'var(--type-table)',
  figure:     'var(--type-figure)',
  other:      'var(--type-other)',
};

let allChunks = [];
let filteredChunks = [];
let activeTypes = new Set();
let activeChapters = new Set();
let allChapterNums = new Set();
let currentPage = 0;
let selectedMethod = 'pdfplumber';
let optLowMemory = false;
let optPreSlice = false;
let currentView = 'chunks';
let pipelineData = [];

// --- View tab switching ---
document.querySelectorAll('.view-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.view-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentView = tab.dataset.view;
    document.getElementById('panel-chunks').classList.toggle('hidden', currentView !== 'chunks');
    document.getElementById('panel-pipeline').classList.toggle('hidden', currentView !== 'pipeline');
    if (currentView === 'pipeline' && pipelineData.length) {
      renderPipeline(pipelineData, false);
    }
  });
});

// --- Init ---
async function init() {
  try {
    const pdfs = await fetch(`${API}/pdfs`).then(r => r.json());
    const sel = document.getElementById('pdf-select');
    if (!pdfs.length) {
      sel.innerHTML = '<option value="">No PDFs found in corpus</option>';
      return;
    }
    sel.innerHTML = '<option value="">— select a PDF —</option>' +
      pdfs.map(p => `<option value="${p}">${p}</option>`).join('');
    sel.value = pdfs[0];
    loadCache(pdfs[0], cacheSuffix());
  } catch {
    setStatus('Cannot reach backend at ' + API, 'error');
  }
}

// --- Marker warning text ---
function updateMarkerWarning() {
  const el = document.getElementById('marker-warning');
  if (selectedMethod !== 'marker') { el.textContent = ''; return; }
  const parts = [];
  if (!optLowMemory && !optPreSlice) {
    parts.push('⚠️ First run downloads ~1–2 GB of ML models (5 models, float32) and may take 1–3 min on CPU.');
  } else {
    if (optLowMemory) parts.push('B active: float16/cpu + no TableProcessor — saves ~2–3 GB RAM; tables skipped.');
    if (optPreSlice) parts.push('C active: PDF sliced to /tmp before parsing — enforces 50-page hard cap.');
    if (!optLowMemory) parts.push('⚠️ Standard model load still ~1–2 GB first run.');
  }
  el.textContent = parts.join(' ');
}

// --- Cache suffix (must mirror backend _cache_suffix) ---
function cacheSuffix() {
  const parts = [selectedMethod];
  if (selectedMethod === 'marker') {
    if (optLowMemory) parts.push('lowmem');
    if (optPreSlice)  parts.push('sliced');
  }
  return parts.join('__');
}

// --- Method toggle ---
document.querySelectorAll('.method-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.method-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedMethod = btn.dataset.method;
    document.getElementById('marker-options').classList.toggle('visible', selectedMethod === 'marker');
    updateMarkerWarning();
    const pdf = document.getElementById('pdf-select').value;
    if (pdf) loadCache(pdf, cacheSuffix());
  });
});

// --- Marker sub-option chips ---
document.getElementById('opt-lowmem').addEventListener('click', () => {
  optLowMemory = !optLowMemory;
  document.getElementById('opt-lowmem').classList.toggle('on', optLowMemory);
  updateMarkerWarning();
  const pdf = document.getElementById('pdf-select').value;
  if (pdf) loadCache(pdf, cacheSuffix());
});
document.getElementById('opt-preslice').addEventListener('click', () => {
  optPreSlice = !optPreSlice;
  document.getElementById('opt-preslice').classList.toggle('on', optPreSlice);
  updateMarkerWarning();
  const pdf = document.getElementById('pdf-select').value;
  if (pdf) loadCache(pdf, cacheSuffix());
});

// --- Run ---
document.getElementById('run-btn').addEventListener('click', async () => {
  const pdf = document.getElementById('pdf-select').value;
  if (!pdf) { setStatus('Select a PDF first.', 'error'); return; }

  setStatus('Chunking…', '');
  setSpinner(true);
  setRunDisabled(true);

  try {
    const res = await fetch(`${API}/chunk`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        pdf,
        method: selectedMethod,
        low_memory: optLowMemory,
        pre_slice: optPreSlice,
      }),
    });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail || res.statusText);
    }
    const data = await res.json();
    const ms = data.total_ms ? ` in ${data.total_ms}ms` : '';
    setStatus(`${data.count} chunks${data.cached ? ' (cached)' : ms}`, 'success');
    pipelineData = data.pipeline || [];
    loadChunks(data.chunks);
    if (currentView === 'pipeline') renderPipeline(pipelineData, !data.cached);
  } catch (e) {
    setStatus('Error: ' + e.message, 'error');
  } finally {
    setSpinner(false);
    setRunDisabled(false);
  }
});

// --- Clear cache ---
document.getElementById('clear-btn').addEventListener('click', async () => {
  const pdf = document.getElementById('pdf-select').value;
  if (!pdf) return;
  const stem = pdf.replace(/\.pdf$/i, '');
  try {
    await fetch(`${API}/chunk/${encodeURIComponent(stem)}/${cacheSuffix()}`, { method: 'DELETE' });
    setStatus('Cache cleared.', '');
  } catch {
    setStatus('Could not clear cache.', 'error');
  }
});

// --- Load cache on PDF change ---
document.getElementById('pdf-select').addEventListener('change', async () => {
  const pdf = document.getElementById('pdf-select').value;
  if (pdf) loadCache(pdf, cacheSuffix());
});

async function loadCache(pdf, suffix) {
  const stem = pdf.replace(/\.pdf$/i, '');
  try {
    const res = await fetch(`${API}/chunk/${encodeURIComponent(stem)}/${suffix}`);
    if (res.ok) {
      const data = await res.json();
      setStatus(`${data.count} chunks (cached)`, 'success');
      pipelineData = data.pipeline || [];
      loadChunks(data.chunks);
      if (currentView === 'pipeline') renderPipeline(pipelineData, false);
    } else {
      clearView();
    }
  } catch {
    clearView();
  }
}

// --- Load chunks into state ---
function loadChunks(chunks) {
  allChunks = chunks;
  buildChapterFilter(chunks);
  buildTypeFilter(chunks);
  applyFilters();
  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('summary-bar').style.display = 'flex';
}

function clearView() {
  allChunks = [];
  filteredChunks = [];
  pipelineData = [];
  document.getElementById('chunks-list').innerHTML = '';
  document.getElementById('pagination').style.display = 'none';
  document.getElementById('summary-bar').style.display = 'none';
  document.getElementById('empty-state').style.display = 'flex';
  document.getElementById('type-filter').innerHTML = '';
  document.getElementById('chapter-filter').innerHTML =
    '<span style="font-size:11px;color:var(--muted)">Run chunking to see chapters</span>';
  activeTypes.clear();
  activeChapters.clear();
  allChapterNums.clear();
  document.getElementById('pipeline-view').innerHTML =
    '<div class="pipeline-empty">Run chunking to see the pipeline.</div>';
}

// --- Chapter filter ---
function buildChapterFilter(chunks) {
  const chapterMap = {};
  chunks.forEach(c => {
    if (c.chapter) {
      chapterMap[c.chapter] = c.chapter_title || `Chapter ${c.chapter}`;
    }
  });
  const nums = Object.keys(chapterMap).sort((a, b) => parseInt(a) - parseInt(b));
  allChapterNums = new Set(nums);
  activeChapters = new Set(nums);

  const container = document.getElementById('chapter-filter');
  if (!nums.length) {
    container.innerHTML = '<span style="font-size:11px;color:var(--muted)">No chapters detected</span>';
    return;
  }
  container.innerHTML = '';

  const allChip = document.createElement('div');
  allChip.className = 'chapter-chip on';
  allChip.textContent = 'all';
  allChip.addEventListener('click', () => {
    if (activeChapters.size === nums.length) {
      activeChapters.clear();
      container.querySelectorAll('.chapter-chip:not(.all-ch-chip)').forEach(c => c.classList.remove('on'));
    } else {
      activeChapters = new Set(nums);
      container.querySelectorAll('.chapter-chip:not(.all-ch-chip)').forEach(c => c.classList.add('on'));
    }
    applyFilters();
  });
  allChip.classList.add('all-ch-chip');
  container.appendChild(allChip);

  nums.forEach(num => {
    const chip = document.createElement('div');
    chip.className = 'chapter-chip on';
    chip.textContent = `Ch.${num}`;
    chip.title = chapterMap[num];
    chip.dataset.chapter = num;
    chip.addEventListener('click', () => {
      if (activeChapters.has(num)) {
        activeChapters.delete(num);
        chip.classList.remove('on');
      } else {
        activeChapters.add(num);
        chip.classList.add('on');
      }
      applyFilters();
    });
    container.appendChild(chip);
  });
}

// --- Type filter ---
function buildTypeFilter(chunks) {
  const counts = {};
  chunks.forEach(c => { counts[c.type] = (counts[c.type] || 0) + 1; });
  const types = Object.keys(counts).sort();
  activeTypes = new Set(types);

  const container = document.getElementById('type-filter');
  container.innerHTML = '';

  const allChip = document.createElement('div');
  allChip.className = 'type-chip on';
  allChip.textContent = 'all';
  allChip.style.background = 'rgba(108,140,255,0.15)';
  allChip.style.borderColor = 'var(--accent)';
  allChip.style.color = 'var(--accent)';
  allChip.addEventListener('click', () => {
    if (activeTypes.size === types.length) {
      activeTypes.clear();
      container.querySelectorAll('.type-chip:not(.all-chip)').forEach(c => c.classList.remove('on'));
    } else {
      activeTypes = new Set(types);
      container.querySelectorAll('.type-chip:not(.all-chip)').forEach(c => c.classList.add('on'));
    }
    applyFilters();
  });
  allChip.classList.add('all-chip');
  container.appendChild(allChip);

  types.forEach(type => {
    const color = TYPE_COLORS[type] || TYPE_COLORS.other;
    const chip = document.createElement('div');
    chip.className = 'type-chip on';
    chip.textContent = `${type} ${counts[type]}`;
    chip.style.background = color + '22';
    chip.style.borderColor = color;
    chip.style.color = color;
    chip.dataset.type = type;
    chip.addEventListener('click', () => {
      if (activeTypes.has(type)) {
        activeTypes.delete(type);
        chip.classList.remove('on');
      } else {
        activeTypes.add(type);
        chip.classList.add('on');
      }
      applyFilters();
    });
    container.appendChild(chip);
  });
}

// --- Filters ---
['page-from', 'page-to', 'search-box'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => { currentPage = 0; applyFilters(); });
});

function applyFilters() {
  const pageFrom = parseInt(document.getElementById('page-from').value) || 0;
  const pageTo   = parseInt(document.getElementById('page-to').value)   || Infinity;
  const search   = document.getElementById('search-box').value.toLowerCase().trim();

  filteredChunks = allChunks.filter(c => {
    if (!activeTypes.has(c.type)) return false;
    if (allChapterNums.size > 0 && c.chapter && !activeChapters.has(c.chapter)) return false;
    if (pageFrom && c.page_end < pageFrom) return false;
    if (pageTo < Infinity && c.page_start > pageTo) return false;
    if (search && !c.text.toLowerCase().includes(search) &&
        !(c.heading_text || '').toLowerCase().includes(search)) return false;
    return true;
  });

  currentPage = 0;
  renderPage();
  updateSummary();
}

// --- Render chunks ---
function renderPage() {
  const list = document.getElementById('chunks-list');
  const pag  = document.getElementById('pagination');
  list.innerHTML = '';

  const start = currentPage * PAGE_SIZE;
  const page  = filteredChunks.slice(start, start + PAGE_SIZE);
  const totalPages = Math.ceil(filteredChunks.length / PAGE_SIZE);

  page.forEach(chunk => list.appendChild(buildCard(chunk)));

  if (totalPages > 1) {
    pag.style.display = 'flex';
    pag.innerHTML = '';

    const prev = document.createElement('button');
    prev.className = 'pag-btn';
    prev.textContent = '← Prev';
    prev.disabled = currentPage === 0;
    prev.addEventListener('click', () => { currentPage--; renderPage(); });
    pag.appendChild(prev);

    const range = pageRange(currentPage, totalPages);
    range.forEach(p => {
      if (p === '…') {
        const el = document.createElement('span');
        el.className = 'pag-info';
        el.textContent = '…';
        pag.appendChild(el);
      } else {
        const btn = document.createElement('button');
        btn.className = 'pag-btn' + (p === currentPage ? ' active' : '');
        btn.textContent = p + 1;
        btn.addEventListener('click', () => { currentPage = p; renderPage(); });
        pag.appendChild(btn);
      }
    });

    const next = document.createElement('button');
    next.className = 'pag-btn';
    next.textContent = 'Next →';
    next.disabled = currentPage >= totalPages - 1;
    next.addEventListener('click', () => { currentPage++; renderPage(); });
    pag.appendChild(next);
  } else {
    pag.style.display = 'none';
  }

  list.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function pageRange(cur, total) {
  if (total <= 7) return Array.from({ length: total }, (_, i) => i);
  const result = [];
  result.push(0);
  if (cur > 2) result.push('…');
  for (let i = Math.max(1, cur - 1); i <= Math.min(total - 2, cur + 1); i++) result.push(i);
  if (cur < total - 3) result.push('…');
  result.push(total - 1);
  return result;
}

function buildCard(chunk) {
  const color = TYPE_COLORS[chunk.type] || TYPE_COLORS.other;
  const card = document.createElement('div');
  card.className = 'chunk-card';

  const header = document.createElement('div');
  header.className = 'chunk-header';

  const badge = document.createElement('span');
  badge.className = 'badge badge-type';
  badge.textContent = chunk.type;
  badge.style.background = color + '33';
  badge.style.borderColor = color;
  badge.style.color = color;

  const idEl = document.createElement('span');
  idEl.className = 'chunk-id';
  idEl.textContent = chunk.id;

  header.appendChild(badge);
  header.appendChild(idEl);

  if (chunk.chapter_title) {
    const cl = document.createElement('span');
    cl.className = 'chunk-chapter-label';
    cl.textContent = chunk.chapter_title;
    cl.title = chunk.chapter_title;
    header.appendChild(cl);
  }

  if (chunk.heading_text) {
    const h = document.createElement('span');
    h.className = 'chunk-heading';
    h.textContent = chunk.heading_text;
    header.appendChild(h);
  }

  const meta = document.createElement('div');
  meta.className = 'chunk-meta';

  if (chunk.has_math) {
    const m = document.createElement('span');
    m.className = 'math-pill';
    m.textContent = '∑ math';
    meta.appendChild(m);
  }

  const pages = document.createElement('span');
  pages.className = 'meta-pill';
  pages.textContent = chunk.page_start === chunk.page_end
    ? `p.${chunk.page_start}`
    : `p.${chunk.page_start}–${chunk.page_end}`;
  meta.appendChild(pages);

  const toks = document.createElement('span');
  toks.className = 'meta-pill';
  toks.textContent = `${chunk.token_count}w`;
  meta.appendChild(toks);

  header.appendChild(meta);
  card.appendChild(header);

  const textEl = document.createElement('div');
  textEl.className = 'chunk-text';
  textEl.textContent = chunk.text;
  card.appendChild(textEl);

  const expandBtn = document.createElement('button');
  expandBtn.className = 'expand-btn';
  expandBtn.textContent = 'Show more';
  expandBtn.addEventListener('click', () => {
    const expanded = textEl.classList.toggle('expanded');
    expandBtn.textContent = expanded ? 'Show less' : 'Show more';
  });
  card.appendChild(expandBtn);

  return card;
}

function updateSummary() {
  const el = document.getElementById('summary-text');
  const types = {};
  filteredChunks.forEach(c => { types[c.type] = (types[c.type] || 0) + 1; });
  const breakdown = Object.entries(types)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 5)
    .map(([t, n]) => `${n} ${t}`)
    .join(', ');
  el.innerHTML = `<strong>${filteredChunks.length}</strong> of ${allChunks.length} chunks shown — ${breakdown || 'no types selected'}`;
}

// --- Pipeline view ---
function renderPipeline(stages, animate) {
  const container = document.getElementById('pipeline-view');
  if (!stages || !stages.length) {
    container.innerHTML = '<div class="pipeline-empty">No pipeline data available. Run chunking first (cached results include pipeline data from v0.2+).</div>';
    return;
  }

  const maxCount = Math.max(...stages.map(s => s.count), 1);

  container.innerHTML = '';

  const hdr = document.createElement('div');
  hdr.className = 'pipeline-header';
  hdr.innerHTML = `<strong>${stages.length} stages</strong> · ${selectedMethod} method`;
  container.appendChild(hdr);

  stages.forEach((stage, i) => {
    const lane = document.createElement('div');
    lane.className = 'pipeline-lane';

    // Connector column
    const connector = document.createElement('div');
    connector.className = 'lane-connector';
    const dot = document.createElement('div');
    dot.className = 'lane-dot';
    const line = document.createElement('div');
    line.className = 'lane-line';
    connector.appendChild(dot);
    connector.appendChild(line);

    // Card
    const card = document.createElement('div');
    card.className = 'lane-card';
    card.dataset.stage = stage.stage;

    // Inherit dot colour from card's CSS custom stage colour if set
    // (CSS handles this via attribute selector on lane-card)

    const top = document.createElement('div');
    top.className = 'lane-top';

    const countEl = document.createElement('div');
    countEl.className = 'lane-count' + (stage.count === 0 ? ' zero' : '');
    countEl.textContent = animate ? '0' : stage.count.toLocaleString();

    const nameEl = document.createElement('div');
    nameEl.className = 'lane-stage-name';
    nameEl.textContent = STAGE_LABELS[stage.stage] || stage.stage;

    const elapsedEl = document.createElement('div');
    elapsedEl.className = 'lane-elapsed';
    elapsedEl.textContent = `${stage.elapsed_ms}ms`;

    top.appendChild(countEl);
    top.appendChild(nameEl);
    top.appendChild(elapsedEl);

    const detailEl = document.createElement('div');
    detailEl.className = 'lane-detail';
    detailEl.textContent = stage.detail || '';

    const barWrap = document.createElement('div');
    barWrap.className = 'lane-bar-wrap';
    const bar = document.createElement('div');
    bar.className = 'lane-bar';
    barWrap.appendChild(bar);

    card.appendChild(top);
    card.appendChild(detailEl);
    card.appendChild(barWrap);

    lane.appendChild(connector);
    lane.appendChild(card);
    container.appendChild(lane);

    if (animate) {
      const delay = i * 180;
      setTimeout(() => {
        dot.classList.add('animate');
        card.classList.add('animate');
        // Animate count up
        const target = stage.count;
        const duration = 500;
        const start = performance.now();
        function tick(now) {
          const t = Math.min((now - start) / duration, 1);
          const ease = 1 - Math.pow(1 - t, 3);
          countEl.textContent = Math.round(ease * target).toLocaleString();
          if (t < 1) requestAnimationFrame(tick);
          else countEl.textContent = target.toLocaleString();
        }
        requestAnimationFrame(tick);
        // Bar fill
        bar.style.width = ((stage.count / maxCount) * 100) + '%';

        setTimeout(() => {
          dot.classList.remove('animate');
          card.classList.remove('animate');
        }, 700);
      }, delay);
    } else {
      bar.style.width = ((stage.count / maxCount) * 100) + '%';
    }
  });
}

function setStatus(msg, type) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status-bar' + (type ? ' ' + type : '');
}
function setSpinner(on) {
  document.getElementById('spinner').style.display = on ? 'block' : 'none';
}
function setRunDisabled(on) {
  document.getElementById('run-btn').disabled = on;
  document.getElementById('run-btn').textContent = on ? 'Chunking…' : 'Chunk (pages 1–50)';
}

init();
</script>
